{% extends 'layout.html' %}

{% block content %}
    <a href="{{ url_for('index') }}">Back to Home</a>
    <h2>Edit Log</h2>
    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}
    <form action="{{ url_for('edit_log', id=log.logID) }}" method="POST">
        <label for="rating">Rating:</label>
        <input type="number" id="rating" name="rating" value="{{ log.rating }}" min="1" max="10" required><br>
    
        <label for="review">Review:</label>
        <textarea id="review" name="review" required>{{ log.review }}</textarea><br>
    
        <label for="favorite">Favorite:</label>
        <input type="checkbox" id="favorite" name="favorite" {% if log.favorite %} checked {% endif %}><br>
    
        <button type="submit">Submit</button>
    </form>    
    
    
{% endblock %}
